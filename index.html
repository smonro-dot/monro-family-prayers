<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0e0c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Night Prayer for each day, the Morning Offering, the Rosary, and common prayers. Offline on your phone.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monro Prayers">
  <meta name="format-detection" content="telephone=no">
  <title>Monro Family Prayers</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <div class="cross" aria-hidden="true"></div>
    <h1>Monro Family Prayers</h1>
    <p class="tagline">Night prayer, morning offering, rosary</p>
  </header>
  <nav id="nav" class="nav" aria-label="Prayers"></nav>
  <main id="content"></main>
  <footer>
    <p id="offline-status">Opening…</p>
    <p><a href="sources.html">Text sources</a></p>
  </footer>
  <div id="dock" class="dock" hidden data-state="idle">
    <div class="dock-row">
      <button type="button" id="dock-toggle">Play</button>
      <div class="dock-copy">
        <div id="dock-title"></div>
        <div id="dock-state">Ready</div>
      </div>
    </div>
    <audio id="prayer-audio" controls playsinline webkit-playsinline preload="auto"></audio>
  </div>
  <script src="js/prayers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
